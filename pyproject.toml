[project]
name = "rassa-backend"
version = "0.1.0"
description = "API REST para Rassa."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "django-cors-headers>=4.3,<4.4",
    "psycopg2-binary>=2.9,<2.10",
    "python-decouple>=3.8",
    "gunicorn>=22.0",
    "dj-database-url>=2.1,<2.2",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = []
