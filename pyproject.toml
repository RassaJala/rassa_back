[project]
name = "rassa-backend"
version = "0.1.0"
description = "API REST para Rassa."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "django-cors-headers>=4.3,<4.4",
    "psycopg2-binary>=2.9,<2.10",
    "python-decouple>=3.8,<4.0",
    "gunicorn>=22.0,<23.0",
    "dj-database-url>=2.1,<2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.4",
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=5.0,<6.0",
    "pre-commit>=3.7,<4.0",
    "pylint>=3.0,<4.0",
    "pylint-django>=2.6,<3.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "migrations",
    "__pycache__",
    ".git",
    "venv",
    ".venv",
    "db",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rassa.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
